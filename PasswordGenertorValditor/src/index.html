<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Password Generator/Validator</title>
</head>
<body>
    <h1 id="main-header">Password Generator & Validator</h1>
    <div id="input">
        <div>
            <input id="password-input" type="password" placeholder="Enter Password">
            <input id="showPassword" type="checkbox" onclick="togglePasswordVisibility()">
        </div>
        <div id="buttons">
            <button id="validate" onclick="validatePassword()">Validate Password</button>
            <button id="generate" onclick="generatePassword()">Generate Password</button>
        </div>
    </div>
    <div id="ranks"></div>
</body>
<script src="js/script.js"></script>
</html>
